name: Mac app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["app/**", "roughcut/**", "tests/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - run: pip install -e .[dev] numpy
      - run: pytest -q

  build:
    runs-on: macos-latest
    permissions:
      contents: write # to publish each build as a private release for the app's updater
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: brew install ffmpeg
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Small native helpers (background swap, recorder), copied into the app next to Roughcut.
      - name: Build the native helpers
        run: swift build -c release --package-path helpers
      - name: Check the background swap works
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440 -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -y "$RUNNER_TEMP/in.mp4"
          helpers/.build/release/roughcut-matte "$RUNNER_TEMP/in.mp4" 0.5 1.5 "$RUNNER_TEMP/out.mp4" color:#00ff88
          ffprobe -v error -show_entries stream=codec_type,duration -of csv=p=0 "$RUNNER_TEMP/out.mp4" | tee "$RUNNER_TEMP/streams.txt"
          grep -q '^video,' "$RUNNER_TEMP/streams.txt" && grep -q '^audio,' "$RUNNER_TEMP/streams.txt"
          awk -F, '{ if ($2 < 0.9 || $2 > 1.1) exit 1 }' "$RUNNER_TEMP/streams.txt"
      # The build number is the version's last part, so the app can tell when a newer build exists.
      - run: npx tauri build --bundles app,dmg --config '{"version":"0.1.${{ github.run_number }}","bundle":{"macOS":{"files":{"MacOS/roughcut-matte":"../helpers/.build/release/roughcut-matte","MacOS/roughcut-recorder":"../helpers/.build/release/roughcut-recorder"}}}}'
      - name: Check the helpers are in the app
        run: |
          test -x src-tauri/target/release/bundle/macos/Roughcut.app/Contents/MacOS/roughcut-matte
          test -x src-tauri/target/release/bundle/macos/Roughcut.app/Contents/MacOS/roughcut-recorder
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" src-tauri/target/release/bundle/macos/Roughcut.app/Contents/Info.plist
      # Ad-hoc signed, so macOS offers "Open Anyway" instead of calling a download "damaged".
      - name: Check the app is signed
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Roughcut.app
      - name: Zip the app
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent Roughcut.app Roughcut.zip
      # Roughcut's "Update" button installs the latest release (see src-tauri/src/update.rs).
      - name: Publish the build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            src-tauri/target/release/bundle/macos/Roughcut.zip src-tauri/target/release/bundle/dmg/*.dmg \
            --title "Build ${{ github.run_number }}" --notes "$(git log -1 --pretty=%s)" --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: Roughcut-mac
          path: |
            app/src-tauri/target/release/bundle/macos/Roughcut.zip
            app/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30
